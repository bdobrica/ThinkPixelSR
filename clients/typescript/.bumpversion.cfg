[bumpversion]
current_version = 0.1.0
commit = False
tag = False

[bumpversion:file:package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:package-lock.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:src/index.ts]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"
